[project]
name = "uzilpy"
version = "0.3.0"
description = "some utilities for python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzilpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
